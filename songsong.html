<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>숑숑닷컴 — 연화 100% 클론 상황실</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @font-face {
    font-family: 'DungGeunMo';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
  }
  :root {
    --bg: #f4efe4;
    --paper: #fdfbf7;
    --card: #ffffff;
    --ink: #241c15;
    --muted: #6e6256;
    --line: #e4dac8;
    --line-strong: #c9bba3;
    --gold: #e6a817;
    --gold-soft: #fef6df;
    --red: #c93b2b;
    --red-soft: #fdf0ee;
    --green: #1f7a4c;
    --green-soft: #edf7f1;
    --blue: #1d5fa7;
    --blue-soft: #eef4fb;
    --wood: #33261b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 1. TOP STATUS BAR ── */
  .topbar {
    min-height: 52px;
    background: var(--wood);
    color: #fff;
    border-bottom: 3px solid #1a120b;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow-x: auto;
  }
  .topbar::-webkit-scrollbar { display: none; }
  .brand-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; white-space: nowrap; }
  .brand-badge {
    font-family: 'DungGeunMo', monospace;
    background: var(--gold);
    color: #1a120b;
    border: 2px solid #000;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .live-dot { width: 8px; height: 8px; background: #f59f00; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .live-dot.live { background: #2ecc71; box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.28); }
  .live-dot.stale { background: #f59f00; }
  .brand-sub { font-size: 12.5px; color: #d8cfc4; font-weight: 500; white-space: nowrap; }

  .metrics-strip { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; flex-shrink: 0; }
  .m-chip {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 6px;
    padding: 4px 9px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .m-chip:hover { background: rgba(255, 255, 255, 0.16); }
  .m-label { color: #bfb3a4; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .m-val { font-weight: 700; color: #fff; white-space: nowrap; }
  .m-val .up { color: #ff8787; }
  .m-val .ok { color: #69db7c; }
  .m-val .dn { color: #74c0fc; }

  /* ── 2. TWO-COLUMN MAIN WORKSPACE ── */
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 16px;
    padding: 14px 16px;
    overflow: hidden;
  }

  /* ── LEFT COLUMN: KAIROSOFT DIORAMA COMPANION ── */
  .diorama-col { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .diorama-card, .bucket-mini-card {
    background: var(--paper);
    border: 2px solid var(--wood);
    border-radius: 10px;
    box-shadow: 0 3px 0 rgba(36, 28, 21, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bucket-mini-card { flex: 1; }
  .diorama-head {
    background: #eae2d3;
    border-bottom: 2px solid var(--wood);
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
  }
  .dh-title { font-family: 'DungGeunMo', monospace; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dh-right { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .dh-hint { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .dh-hint.live { color: var(--green); font-weight: 700; }
  .dh-hint.snapshot { color: #9c5700; font-weight: 700; }
  .dio-toggle-btn {
    font-family: 'DungGeunMo', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1.5px solid var(--wood);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .dio-toggle-btn:hover { background: var(--wood); color: #ffe066; }
  .diorama-card.collapsed .canvas-box,
  .diorama-card.collapsed .state-reason-box { display: none; }
  .diorama-card.collapsed .diorama-head { border-bottom: none; }
  .canvas-box {
    position: relative;
    width: 100%;
    height: 330px;
    background: #d8ccb8;
    border-bottom: 2px solid var(--wood);
    overflow: hidden;
  }
  #dioramaCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .state-reason-box {
    padding: 9px 12px;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sr-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; white-space: nowrap; }
  .sr-badge {
    font-family: 'DungGeunMo', monospace;
    font-size: 11px;
    background: var(--wood);
    color: #ffe066;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sr-trigger { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .sr-rows { display: flex; flex-direction: column; gap: 5px; }
  .sr-item {
    display: grid;
    grid-template-columns: 112px 1fr;
    align-items: baseline;
    font-size: 12.2px;
    line-height: 1.42;
    padding: 4px 7px;
    border-radius: 5px;
    background: #f6f2e9;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .sr-item:hover { border-color: var(--wood); background: #efe9dc; }
  .sr-who { font-family: 'DungGeunMo', monospace; font-size: 11.5px; color: var(--wood); }
  .sr-why { color: var(--ink); font-weight: 500; }

  .bm-body {
    flex: 1;
    padding: 10px 13px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 6px;
  }
  .bm-row {
    display: grid;
    grid-template-columns: 92px 1fr 155px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .bm-name { font-weight: 700; color: var(--ink); }
  .bm-track { height: 8px; background: #e9e2d4; border-radius: 4px; overflow: hidden; border: 1px solid #cbbba0; }
  .bm-fill { height: 100%; border-radius: 3px; }
  .bm-desc { text-align: right; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── RIGHT COLUMN: PRIMARY SONGSONG.COM READER ── */
  .main-col {
    background: var(--paper);
    border: 2px solid var(--wood);
    border-radius: 10px;
    box-shadow: 0 4px 0 rgba(36, 28, 21, 0.14);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .nav-tabs {
    background: #eae2d3;
    border-bottom: 2px solid var(--wood);
    padding: 8px 14px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
  }
  .tab-list { display: flex; gap: 6px; flex-wrap: nowrap; }
  .tab-btn {
    font-family: 'DungGeunMo', monospace;
    background: #ddd3c0;
    color: #5a4b3c;
    border: 2px solid var(--wood);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 9px 13px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn:hover { background: #e8dfd0; color: var(--ink); }
  .tab-btn.active {
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 11px;
    margin-bottom: -2px;
    box-shadow: inset 0 3px 0 var(--gold);
  }
  .tab-num { font-size: 11px; background: rgba(0,0,0,0.1); padding: 1px 5px; border-radius: 3px; }

  .sub-toolbar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: #f8f4ec;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .slot-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot-pill {
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1.5px solid var(--line-strong);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
  }
  .slot-pill.active { background: var(--wood); color: #ffe066; border-color: var(--wood); }
  .source-tag { font-size: 12px; color: var(--muted); font-weight: 500; }

  .reader-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .section-card {
    background: var(--card);
    border: 1.5px solid var(--line-strong);
    border-radius: 8px;
    padding: 15px 18px;
  }
  .sc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
  }
  .sc-title {
    font-family: 'DungGeunMo', monospace;
    font-size: 14px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sc-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--gold); border: 1px solid var(--ink); }
  .sc-meta { font-size: 12px; color: var(--muted); }

  .lead-judgment {
    background: var(--gold-soft);
    border-left: 4px solid var(--gold);
    padding: 12px 15px;
    border-radius: 0 6px 6px 0;
    font-size: 14.5px;
    line-height: 1.65;
    font-weight: 600;
    color: #1f1812;
  }

  .insight-list { display: flex; flex-direction: column; gap: 10px; }
  .ins-item {
    background: #faf8f4;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 11px 14px;
  }
  .ins-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .ins-cat {
    font-family: 'DungGeunMo', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: #eae2d3;
    color: var(--wood);
  }
  .ins-headline { font-size: 14px; font-weight: 800; color: #8f2d1e; }
  .ins-text { font-size: 13.6px; line-height: 1.6; color: #2c241d; }

  .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .pos-box {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 9px 11px;
    background: #fcfaf6;
    font-size: 13px;
    line-height: 1.48;
  }
  .pos-badge {
    font-family: 'DungGeunMo', monospace;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 5px;
    display: inline-block;
  }
  .pb-sell { background: var(--red-soft); color: var(--red); border: 1px solid #f1b9b3; }
  .pb-buy  { background: var(--green-soft); color: var(--green); border: 1px solid #a9dfc0; }
  .pb-hold { background: var(--blue-soft); color: var(--blue); border: 1px solid #adcbf0; }
  .pb-avoid { background: #f1f3f5; color: #495057; border: 1px solid #ced4da; }
  .rv-badge {
    font-family: 'DungGeunMo', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    display: inline-block;
    white-space: nowrap;
  }
  .rv-pass { background: #edf7f1; color: #1f7a4c; border: 1px solid #a9dfc0; }
  .rv-warn { background: #fff4e6; color: #b35c00; border: 1px solid #ffc078; }
  .rv-hold { background: #f1f3f5; color: #495057; border: 1px solid #ced4da; }
  .rv-drop { background: #fdf0ee; color: #c93b2b; border: 1px solid #f1b9b3; }
  .dec-filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    background: #f8f4ec;
    border: 1.5px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .stat-pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .stat-pill {
    font-size: 12px;
    font-weight: 600;
    background: #f6f2e8;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 3px 8px;
    color: var(--ink);
  }

  .watch-bar { background: #f5f0e5; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #3d3227; }

  .bucket-5-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .b5-col {
    background: #faf8f4;
    border: 1.5px solid var(--line-strong);
    border-radius: 7px;
    padding: 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .b5-head {
    font-family: 'DungGeunMo', monospace;
    font-size: 12.5px;
    padding: 5px 6px;
    border-radius: 4px;
    text-align: center;
    background: #eae2d3;
    color: var(--ink);
  }
  .b5-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 12.3px;
    line-height: 1.4;
    font-weight: 600;
  }

  .stage-7-bar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0 12px; }
  .st-box {
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    padding: 7px 5px;
    text-align: center;
    background: #faf8f4;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .st-box:hover { background: #efe9dc; transform: translateY(-1px); }
  .st-box .num { font-family: 'DungGeunMo', monospace; font-size: 11px; display: block; margin-bottom: 3px; }
  .st-box.now-zone { background: var(--green-soft); border: 2px solid var(--green); color: var(--green); font-weight: 800; }
  .st-box.sim-zone { background: var(--gold-soft); border: 2px solid var(--gold); color: var(--ink); font-weight: 800; }

  .clean-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .clean-table th {
    background: #f4efe4;
    color: var(--ink);
    font-weight: 700;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--line-strong);
    font-size: 12px;
  }
  .clean-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; line-height: 1.5; }
  .prob-cell { display: flex; align-items: center; gap: 9px; }
  .p-bar { width: 84px; height: 8px; background: #eae2d3; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .p-fill { height: 100%; background: var(--gold); }
  .ext-link {
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-decoration: none;
    border: 1px solid var(--line-strong);
    background: #f8f4ec;
    color: var(--ink);
  }
  .ext-link:hover { background: var(--wood); color: #fff; }

  /* ── 3. MOBILE & TABLET RESPONSIVE LAYOUT ── */
  @media (max-width: 980px) {
    html, body {
      width: 100%;
      max-width: 100vw;
      height: auto;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 8px 12px;
      width: 100%;
      max-width: 100vw;
    }
    .workspace {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      height: auto;
      overflow: visible;
      padding: 10px;
      gap: 12px;
    }
    .diorama-head {
      white-space: normal;
      flex-wrap: wrap;
    }
    .dh-title, .sr-badge {
      white-space: normal;
    }
    .slot-pill {
      white-space: normal;
      word-break: keep-all;
      line-height: 1.4;
    }
    .diorama-col, .main-col, .diorama-card, .bucket-mini-card, .section-card, .sub-toolbar, .sc-head {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .sc-head {
      flex-wrap: wrap;
      gap: 4px;
    }
    .sc-title {
      white-space: normal;
      word-break: keep-all;
    }
    .canvas-box {
      width: 100%;
      height: auto;
      aspect-ratio: 440 / 330;
    }
    #dioramaCanvas {
      width: 100%;
      height: auto;
      aspect-ratio: 440 / 330;
    }
    .nav-tabs {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      padding: 8px 10px 0;
      -webkit-overflow-scrolling: touch;
    }
    .tab-list {
      display: inline-flex;
      min-width: max-content;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .reader-body {
      overflow-y: visible;
      padding: 12px;
      min-width: 0;
    }
    .pos-grid {
      grid-template-columns: 1fr;
    }
    .bucket-5-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .stage-7-bar {
      grid-template-columns: repeat(4, 1fr);
    }
    .bm-row {
      grid-template-columns: 76px 1fr 110px;
    }
    .sr-item {
      grid-template-columns: 1fr;
      gap: 2px;
      font-size: 11.8px;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .clean-table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }
  @media (max-width: 520px) {
    .bucket-5-grid {
      grid-template-columns: 1fr;
    }
    .stage-7-bar {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  /* Daily report markdown styling */
  .report-md { font-size: 14px; line-height: 1.65; color: var(--ink); overflow-x: auto; }
  .report-md h1 { font-size: 20px; font-weight: 800; margin: 4px 0 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .report-md h2 { font-size: 16.5px; font-weight: 800; margin: 22px 0 8px; padding: 6px 10px; background: #efe7d6; border-left: 4px solid var(--gold); border-radius: 4px; }
  .report-md h3 { font-size: 14.5px; font-weight: 800; margin: 14px 0 6px; color: #3d3124; }
  .report-md p { margin: 6px 0; }
  .report-md ul, .report-md ol { margin: 6px 0 10px; padding-left: 20px; }
  .report-md li { margin: 3px 0; }
  .report-md table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 12.5px; background: #fff; border: 1px solid var(--line-strong); }
  .report-md th { background: #efe7d6; text-align: left; padding: 7px 9px; font-weight: 800; border-bottom: 1.5px solid var(--line-strong); }
  .report-md td { padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .report-md .chip { display: inline-block; background: #f3ede0; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 99px; padding: 0 7px; font-size: 11px; margin-left: 4px; }
  .morning-pre { background: #1e1914; color: #fdfbf7; padding: 14px 16px; border-radius: 8px; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; border: 2px solid #3a3026; }
</style>
</head>
<body>

  <!-- 1. TOP STATUS BAR -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-badge"><span class="live-dot stale" id="liveStatusDot"></span>숑숑닷컴</div>
      <span class="brand-sub" id="topSub">연화 100% 클론 상황실</span>
    </div>
    <div class="metrics-strip" id="topMetrics"></div>
  </header>

  <!-- 2. WORKSPACE -->
  <main class="workspace">

배당 자산을 사서 배당(리얼티 인컴 등)이 외식비 이상을 채워주니 부동산보다 낫다는 현금흐름 주머니 인증이다.","원천":"증권 앱 배당내역 캡처(리얼티 인컴 · JEPI · SPY · AT&T · 버라이즌 · 필립 모리스 · 카드주 등) + 본인 수익률(며칠 60%) + 담보대출 체계 자기 설명","신호":"공격 주머니에서 며칠 만에 60% 난 수익은 일부 익절해 채권·배당(현금흐름) 주머니로 넘기고, 코어는 담보로만 쓰고 안 판다. 생활비는 배당과 소비 선순환으로 쓰되 쌩돈 매수는 금지하고 빌려서 우상향 자산을 산다.","요약":"[속뜻 완역] 몇 일 만에 60%를 번 수익을 한우·후식 소비로 즐기며, 돈은 쌩돈이 아니라 바이(사고)·버로우(빌리고)·다이(죽을 때까지 안 팔고)로 굴려야 한다는 «안파는기술» 담보대출 체계를 되새긴 날이다. 빌려 쓰는 동안 코어는 우상향하고(2배 쓸 사이 10배 오름 → 8배 남기고 상환), 번 돈으로 채권·배당 자산을 사서 배당(리얼티 인컴 등)이 외식비 이상을 채워주니 부동산보다 낫다는 현금흐름 주머니 인증이다. — 판다: 단기 급등한 공격 자산(며칠 60% 수익분)(공격·익절) / 산다: 리얼티 인컴(국밥 월배당)(현금흐름·채우기), JP모간 에쿼티 프리미엄 인컴 · 필립 모리스 · AT&T · 버라이즌 등 배당주(현금흐름·홀드), 채권(익절 자금으로 매수)(현금흐름·매집), 우상향 코어 자산(담보로만 활용)(코어·홀드), 집(담보대출 레버리지로 매수)(코어·담보매수) / 피한다: 쌩돈으로 집·자산 매수(기타·촉수금지)","클론예측":"장 마감 뒤 식사 · 소비 · 배당 인증 묶음이고 매매 말은 없는 국면, 배당내역으로 국밥같은 리얼티 인컴을 짚은 정도 — 산다: 리얼티 인컴(현금흐름·홀드)","짝점수":33,"대상점수":36},{"날짜":"11-13","시각":"14:37","방":"정보방","진단":"3억을 모으면 20%만 먹어도 6천이라는 수익 구조가 생기고, 그 돈을 쓰는 동안에도 자산이 더 오르니 지수에 태워 두라는 뜻이다. 엔비디아 중국 칩 유출·스파이 보도로 하루 4% 빠진 것은 기획된 위기 연출 성격이라 한국 반도체가 바로 반등한 것을 보며 «중국도 좋아하는 엔비디아»라고 비꼰 것이다. 마가린 영상은 학계·기업이 만든 통념을 의심하라는 생활 통찰이다.","원천":"유튜브 영상 3개(3억 복리·엔비디아 칩 유출 뉴스·마가린 사기극) + 엔비디아 주가 차트 그림 + 뉴스 역발상","신호":"엔비디아 칩 유출 뉴스로 인한 급락은 위기 연출이라 투매 대상이 아니다. 코어(엔비디아)는 홀드하고 시드는 지수에 태운다.","요약":"3억을 모으면 20%만 먹어도 6천이라는 수익 구조가 생기고, 그 돈을 쓰는 동안에도 자산이 더 오르니 지수에 태워 두라는 뜻이다. 엔비디아 중국 칩 유출·스파이 보도로 하루 4% 빠진 것은 기획된 위기 연출 성격이라 한국 반도체가 바로 반등한 것을 보며 «중국도 좋아하는 엔비디아»라고 비꼰 것이다. 마가린 영상은 학계·기업이 만든 통념을 의심하라는 생활 통찰이다. — 산다: 지수 레버리지·지수 추종 자산(시드 3억 목표)(공격·채우기), 엔비디아(코어·홀드), 삼성전자·SK하이닉스(한국 반도체)(공격·홀드) / 피한다: 엔비디아 칩 유출·중국 스파이 뉴스에 의한 공포 투매(코어·가짜뉴스투매금지)","클론예측":"엔비디아 칩 중국 유출·젠슨 황 스캔들로 주가가 빠졌다가 회복 중이다. 악재 헤드라인에 던지지 말고 독점력 재확인으로 읽어 코어를 쥔다. 3억 모으기 영상은 배당 현금흐름으로 굴리라는 쪽이다. — 산다: 엔비디아(코어·홀드), 배당 자산(현금흐름·매집) / 피한다: 악재 헤드라인 투매(기타·거르기)","짝점수":57,"대상점수":75},{"날짜":"11-13","시각":"13:30","방":"정보방","진단":"천만원씩 매년 모으고 기회(폭락) 때마다 2배로 불려 3억 2800까지 간 뒤, 4~5년 바닥에서 배우면 담보를 써서 100억으로 점프한다는 «정확한 수행» 로드맵이다. 배당 종목은 사되 절대 팔지 말고 담보로 쓰며, 일정 규모 이상(10억)에선 20%만 먹고 쓰면 된다. 국부유출·선물 변동성·부동산 붕괴·좌파의 개돼지 양육 구조를 읽고, 상류층·자산가와만 상종하며 돈 많을 때 건강 관리하라는 처세까지 묶여 있다.","원천":"AI 활용·뉴스 역발상(박세익 증안기금 발언 영상, 형세와 기세 블로그, 쇼펜하우어 왕관 영상, 국회 방통위 영상) + 사용자 보유 종목 그림","신호":"기회(폭락) 때마다 2배로 불리고 배당 종목은 팔지 않고 담보로 쓴다. 외곽 부동산은 임계점 붕괴를 앞두고 있어 피하고, 선물 변동성은 외국인 파생 세력의 먹이라 개미는 양방향으로 터지니 레버리지 단타는 조심한다.","요약":"천만원씩 매년 모으고 기회(폭락) 때마다 2배로 불려 3억 2800까지 간 뒤, 4~5년 바닥에서 배우면 담보를 써서 100억으로 점프한다는 «정확한 수행» 로드맵이다. 배당 종목은 사되 절대 팔지 말고 담보로 쓰며, 일정 규모 이상(10억)에선 20%만 먹고 쓰면 된다. 국부유출·선물 변동성·부동산 붕괴·좌파의 개돼지 양육 구조를 읽고, 상류층·자산가와만 상종하며 돈 많을 때 건강 관리하라는 처세까지 묶여 있다. — 판다: 입지 약한 영끌 부동산·외곽 부동산(기타·정리) / 산다: 관리 중인 종목들(지수 편입 종목)(코어·홀드), 배당 종목(주버드콜·커버드콜 등)(현금흐름·담보매수), 지수·레버리지(기회 시 2배 불리기)(공격·채우기), 미국 자산(담보 활용)(코어·홀드) / 피한다: 삼성전자·하이닉스 2배 레버리지 양방향 단타(외국인 파생 변동성 먹이)(공격·촉수금지), 부동산 급락 직격 자산(한방에 따이는 레버리지 부동산)(기타·거르기), 돈 못 버는 지인·엔진 없는 사람과의 교류(기타·거르기)","클론예측":"하락 뒤 급반등 구간에서 대중은 학습된 무기력에 빠지고, 연화님은 시드를 모으지 말고 바로 배당을 쌓아 기회마다 레버리지로 불리라고 읽는다 — 판다: 시드머니 적금(기타·정리) / 산다: 주버드콜(현금흐름·매집), 지수 레버리지(공격·홀드) / 피한다: 적금식 시드머니 모으기(기타·거르기)","짝점수":80,"대상점수":43},{"날짜":"11-13","시각":"13:11","방":"정보방","진단":"IMF처럼 공부할 시간 없이 바로 벌어야 하는 시기이므로, 월급이 나오는 족족 주버드콜을 박고 무이자 할부와 구독형으로 현금 지출을 줄이며 배당부터 늘리라는 뜻이다. 적금으로 시드를 모으는 건 쓰레기이고 기회마다 2배에서 50%씩 불려 스노우볼을 굴려야 한다.","원천":"AI 활용·뉴스 역발상(IMF 유비, 박종훈 박사 의견) + 그림","신호":"월급은 적금이 아니라 즉시 주버드콜(배당)에 투입하고, 지출은 무이자 할부로 돌려 현금흐름을 확보한다.","요약":"IMF처럼 공부할 시간 없이 바로 벌어야 하는 시기이므로, 월급이 나오는 족족 주버드콜을 박고 무이자 할부와 구독형으로 현금 지출을 줄이며 배당부터 늘리라는 뜻이다. 적금으로 시드를 모으는 건 쓰레기이고 기회마다 2배에서 50%씩 불려 스노우볼을 굴려야 한다. — 판다: 시드머니 적금(기타·정리) / 산다: 주버드콜(월급 즉시 투입)(현금흐름·매집), 기회 때 지수 레버리지(2배에서 50%씩 불리기)(공격·채우기) / 피한다: 적금식 시드머니 모으기(기타·거르기), 현금 일시불 지출·구독형 고정지출(기타·거르기)","클론예측":"아파트 감가상각·화폐 타락 영상을 공유한 국면으로, 시드 모을 시간 없이 지금 배당·코어 자산을 쌓고 영끌 아파트는 피하라는 취지 — 산다: 배당 자산(현금흐름·매집), 미장 지수(코어·매집) / 피한다: 영끌 아파트(기타·거르기), 원화 현금 방치(기타·거르기)","짝점수":57,"대상점수":67},{"날짜":"11-13","시각":"10:20","방":"정보방","진단":"AI 시대에 준비 안 된 중산층은 무너지고 자산가는 엔비디아 중심 AI 시스템으로 우상향한다고 봄. 큰 기회(바닥)를 줍기 위해 배당주와 외화를 미리 모으는 국면.","원천":"박종훈 소장 영상 링크, 본인 발언","신호":"엔비디아 롱, 배당주 모으기, 엔화 등 외화 늘 은 호구라며 피하라고 봅니다.","포지션":"산다·채우기: 비트코인(코어) / 산다·숏: 지수 선물·인버스(지정학 리스크 대비)(가드) / 판다·정리: 엔비디아(코어) / 피한다·촉수금지: 외곽 전원주택(기타)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"17:22","방":"정보방","자료":"엔비디아 CEO 사임·개인투자자 매수 관련 뉴스 링크, 에스원 1년 차트, 본인 발언","신호":"200일선 깨면 살 준비와 돈 준비, 지수 홀드, 이번에 탑승해야한다, NVDX 탑승","실제진단":"200일선을 깨면 담보대출을 겹겹이 써서라도 살 준비를 해 두고, AI 버블이 2028년 이후까지 끌려갈 수 있어 지수는 홀드한다고 본다. 엔비디아가 CEO 사임으로 폭락한 때는 탑승할 기회로 읽고, 국내 개별 잡주는 거른다.","포지션":"산다·홀드: 국장·미국 지수 레버리지(공격) / 산다·매집: NVDX(엔비디아 단일종목 레버리지)(공격) / 피한다·거르기: 국내 개별 잡주(기타)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"16:39","방":"정보방","자료":"KODEX 미국배당다우존스 액티브 광고 사진과 스탠퍼드 강의 캡처를 근거로 올렸다.","신호":"경쟁하지 말고 미국에서 배당주","실제진단":"물가가 오르고 화폐가치가 녹는 시대라 국내에서 경쟁하지 말고 미국 배당주로 돈이 가는 흐름을 탄다는 취지다. 연화님은 배당 ETF 광고를 보며 미국으로 돈이 다 가는 중이라고 짚었다.","포지션":"산다·매집: 미국 배당주(미국 배당 ETF)(현금흐름)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"16:10","방":"정보방","자료":"증권 앱 배당내역 캡처(리얼티 인컴 · JEPI · SPY · AT&T · 버라이즌 · 필립 모리스 · 카드주 등) + 본인 수익률(며칠 60%) + 담보대출 체계 자기 설명","신호":"공격 주머니에서 며칠 만에 60% 난 수익은 일부 익절해 채권·배당(현금흐름) 주머니로 넘기고, 코어는 담보로만 쓰고 안 판다. 생활비는 배당과 소비 선순환으로 쓰되 쌩돈 매수는 금지하고 빌려서 우상향 자산을 산다.","실제진단":"[속뜻 완역] 몇 일 만에 60%를 번 수익을 한우·후식 소비로 즐기며, 돈은 쌩돈이 아니라 바이(사고)·버로우(빌리고)·다이(죽을 때까지 안 팔고)로 굴려야 한다는 «안파는기술» 담보대출 체계를 되새긴 날이다. 빌려 쓰는 동안 코어는 우상향하고(2배 쓸 사이 10배 오름 → 8배 남기고 상환), 번 돈으로 채권·배당 자산을 사서 배당(리얼티 인컴 등)이 외식비 이상을 채워주니 부동산보다 낫다는 현금흐름 주머니 인증이다.","포지션":"산다·채우기: 리얼티 인컴(국밥 월배당)(현금흐름) / 산다·홀드: JP모간 에쿼티 프리미엄 인컴 · 필립 모리스 · AT&T · 버라이즌 등 배당주(현금흐름) / 산다·매집: 채권(익절 자금으로 매수)(현금흐름) / 산다·홀드: 우상향 코어 자산(담보로만 활용)(코어) / 산다·담보매수: 집(담보대출 레버리지로 매수)(코어) / 판다·익절: 단기 급등한 공격 자산(며칠 60% 수익분)(공격) / 피한다·촉수금지: 쌩돈으로 집·자산 매수(기타)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"14:37","방":"정보방","자료":"유튜브 영상 3개(3억 복리·엔비디아 칩 유출 뉴스·마가린 사기극) + 엔비디아 주가 차트 그림 + 뉴스 역발상","신호":"엔비디아 칩 유출 뉴스로 인한 급락은 위기 연출이라 투매 대상이 아니다. 코어(엔비디아)는 홀드하고 시드는 지수에 태운다.","실제진단":"3억을 모으면 20%만 먹어도 6천이라는 수익 구조가 생기고, 그 돈을 쓰는 동안에도 자산이 더 오르니 지수에 태워 두라는 뜻이다. 엔비디아 중국 칩 유출·스파이 보도로 하루 4% 빠진 것은 기획된 위기 연출 성격이라 한국 반도체가 바로 반등한 것을 보며 «중국도 좋아하는 엔비디아»라고 비꼰 것이다. 마가린 영상은 학계·기업이 만든 통념을 의심하라는 생활 통찰이다.","포지션":"산다·채우기: 지수 레버리지·지수 추종 자산(시드 3억 목표)(공격) / 산다·홀드: 엔비디아(코어) / 산다·홀드: 삼성전자·SK하이닉스(한국 반도체)(공격) / 피한다·가짜뉴스투매금지: 엔비디아 칩 유출·중국 스파이 뉴스에 의한 공포 투매(코어)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"13:30","방":"정보방","자료":"AI 활용·뉴스 역발상(박세익 증안기금 발언 영상, 형세와 기세 블로그, 쇼펜하우어 왕관 영상, 국회 방통위 영상) + 사용자 보유 종목 그림","신호":"기회(폭락) 때마다 2배로 불리고 배당 종목은 팔지 않고 담보로 쓴다. 외곽 부동산은 임계점 붕괴를 앞두고 있어 피하고, 선물 변동성은 외국인 파생 세력의 먹이라 개미는 양방향으로 터지니 레버리지 단타는 조심한다.","실제진단":"천만원씩 매년 모으고 기회(폭락) 때마다 2배로 불려 3억 2800까지 간 뒤, 4~5년 바닥에서 배우면 담보를 써서 100억으로 점프한다는 «정확한 수행» 로드맵이다. 배당 종목은 사되 절대 팔지 말고 담보로 쓰며, 일정 규모 이상(10억)에선 20%만 먹고 쓰면 된다. 국부유출·선물 변동성·부동산 붕괴·좌파의 개돼지 양육 구조를 읽고, 상류층·자산가와만 상종하며 돈 많을 때 건강 관리하라는 처세까지 묶여 있다.","포지션":"산다·홀드: 관리 중인 종목들(지수 편입 종목)(코어) / 산다·담보매수: 배당 종목(주버드콜·커버드콜 등)(현금흐름) / 산다·채우기: 지수·레버리지(기회 시 2배 불리기)(공격) / 산다·홀드: 미국 자산(담보 활용)(코어) / 판다·정리: 입지 약한 영끌 부동산·외곽 부동산(기타) / 피한다·촉수금지: 삼성전자·하이닉스 2배 레버리지 양방향 단타(외국인 파생 변동성 먹이)(공격) / 피한다·거르기: 부동산 급락 직격 자산(한방에 따이는 레버리지 부동산)(기타) / 피한다·거르기: 돈 못 버는 지인·엔진 없는 사람과의 교류(기타)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"13:11","방":"정보방","자료":"AI 활용·뉴스 역발상(IMF 유비, 박종훈 박사 의견) + 그림","신호":"월급은 적금이 아니라 즉시 주버드콜(배당)에 투입하고, 지출은 무이자 할부로 돌려 현금흐름을 확보한다.","실제진단":"IMF처럼 공부할 시간 없이 바로 벌어야 하는 시기이므로, 월급이 나오는 족족 주버드콜을 박고 무이자 할부와 구독형으로 현금 지출을 줄이며 배당부터 늘리라는 뜻이다. 적금으로 시드를 모으는 건 쓰레기이고 기회마다 2배에서 50%씩 불려 스노우볼을 굴려야 한다.","포지션":"산다·매집: 주버드콜(월급 즉시 투입)(현금흐름) / 산다·채우기: 기회 때 지수 레버리지(2배에서 50%씩 불리기)(공격) / 판다·정리: 시드머니 적금(기타) / 피한다·거르기: 적금식 시드머니 모으기(기타) / 피한다·거르기: 현금 일시불 지출·구독형 고정지출(기타)","사후결과":"","그의말":"","클론요지":"","결론점수":null,"틀점수":null},{"날짜":"11-13","시각":"10:20","방":"정보방","자료":"박종훈 소장 영상 링크, 본인 발언","신호":"엔비디아 롱, 배당주 모으기, 엔화 등 외화 늘리기, 일본 배당주 매수 시점","실제진단":"AI 시대에 준비 안 된 중산층은 무너지고 자산가는 엔비디아 중심 AI 시스템으로 우상향한다고 봄. 큰 기회(바닥)를 줍기 위해 배당주와 외화를 미리 모으는 국면.","포지션":"산다·매집: 엔비디아(코어) / 산다·매집: 배당주(우상향 배당)(현금흐름) / 산다·매집: 일본 배당주(현 function isFinNum(v) {
  return v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
}
function fmtPct(v, d = 2) {
  return isFinNum(v) ? Number(v).toFixed(d) + '%' : '확인불가';
}
function fmtSignedPct(v, d = 2, suffix = '%') {
  if (!isFinNum(v)) return '확인불가';
  const n = Number(v);
  return (n >= 0 ? '+' : '') + n.toFixed(d) + suffix;
}
function fmtRatioPct(v, d = 1) {
  if (!isFinNum(v)) return '-';
  const n = Number(v);
  const pct = Math.abs(n) <= 1.0 ? (n * 100) : n;
  return pct.toFixed(d) + '%';
}
function fmtPval(v) {
  if (!isFinNum(v)) return '-';
  const n = Number(v);
  return n < 0.0001 ? '<0.0001' : n.toFixed(4);
}
function fmtUsd(v, d = 2) {
  return isFinNum(v) ? '$' + Number(v).toFixed(d) : '확인불가';
}

function updateSyncBadge() {
  const dot = document.getElementById('liveStatusDot');
  const hint = document.getElementById('dioSyncHint');
  const liveNow = isLiveServer && (Date.now() - lastLiveOkTs < 95000);
  if (dot) {
    dot.classList.toggle('live', liveNow);
    dot.classList.toggle('stale', !liveNow);
  }
  if (!hint) return;
  if (liveNow) {
    hint.textContent = '실시간 서버 연동';
    hint.className = 'dh-hint live';
    return;
  }
  const m = (DATA && DATA.meta) || {};
  const bts = Number(m['빌드타임스탬프'] || 0);
  let label = '정적 스냅샷';
  if (bts > 0) {
    const btsMs = bts > 1e11 ? bts : bts * 1000;
    const mins = Math.max(0, Math.floor((Date.now() - btsMs) / 60000));
    label = mins < 1 ? '정적 스냅샷 (방금 빌드)' : (mins < 120 ? `정적 스냅샷 (${mins}분 전 빌드)` : `정적 스냅샷 (${Math.floor(mins / 60)}시간 전 빌드)`);

  hint.textContent = label;

}

function activeCoinSpec() {
  const list = DATA.insights || [];
  const cur = list[selectedInsightIdx] || list[0] || {};
  const sells = (cur['판다'] || []).map(x => `${x['대상']}(${x['주머니']})`);
  const buys  = (cur['산다'] || []).map(x => `${x['대상']}(${x['주머니']})`);
  const sellBuckets = new Set((cur['판다'] || []).map(x => x['주머니']));
  const buyBuckets  = new Set((cur['산다'] || []).map(x => x['주머니']));

  let mode = 'hold', sx = 0.17, sy = 0.56, tx = 0.17, ty = 0.56;
  let badge = '홀드 유지';
  let reason = '신규 매매 이동 없이 코어·현금흐름 홀드 유지 (가짜 패킷 이동 정지)';
  if (sellBuckets.has('가드') && buyBuckets.has('공격')) {
    mode = 'guard_to_attack';
    sx = 0.27; sy = 0.52; tx = 0.08; ty = 0.52;
    badge = '가드→공격 전환';
    reason = '[' + (cur['때'] || '') + '] 가드 익절(' + sells.slice(0,2).join('·') + ') → 공격 매수(' + buys.slice(0,2).join('·') + ') 전환';
  } else if (sells.length && buys.length) {
    mode = 'attack_to_cash';
    sx = 0.24; sy = 0.52; tx = 0.48; ty = 0.52;
    badge = '익절→배당복사';
    reason = '[' + (cur['때'] || '') + '] 판다(' + sells.slice(0,2).join('·') + ') → 산다(' + buys.slice(0,2).join('·') + ') 순환 작동';
  } else if (buys.length) {
    mode = 'buy_flow';
    sx = 0.24; sy = 0.28; tx = 0.17; ty = 0.48;
    badge = '매집 적립';
    reason = '[' + (cur['때'] || '') + '] 매집(' + buys.slice(0,3).join('·') + ') 금고 적립 중';
  }
  return { mode, sx, sy, tx, ty, badge, reason, slotLabel: cur['라벨'] || '' };
}

    </div>

      <span class="m-val">${adrStr}</span>

      <span class="m-val">${mindoTxt}</span>

    <div class="m-chip" onclick="selectTab('reports')" title="펜타곤 주변 피자 매장 혼잡도 지수 (DOUGHCON)">

      <span class="m-val"><span class="${pizzaCls}">${pizzaTxt}</span></span>
    </div>
    <div class="m-chip" onclick="selectTab('decoder')" style="opacity:0.78; font-size:11px;">
      <span class="m-label">클론보조지표</span>
      <span class="m-val">${cloneScoreTxt}</span>

    tr[0] = { who: '3번 금고 자금', tab: 'buckets', why: cs.reason };

    tr[1] = { who: '2번 화랑 군중', tab: 'psych', why: stSpec.crowdDesc + ' / ' + stSpec.cloneDesc };

  const bucketDefs = [

    { key: '기타', label: '피할 함정', col: '#868e96' }
  ];
  const counts = bucketDefs.map(d => (bk[d.key] || []).reduce((acc, it) => acc + Number(it['횟수'] || 1), 0));
  const maxCnt = Math.max(1, ...counts);
  document.getElementById('miniBuckets').innerHTML = bucketDefs.map((r, i) => {
    const cnt = counts[i];
    const w = cnt > 0 ? Math.max(8, Math.round((cnt / maxCnt) * 100)) : 0;

        <div class="bm-track"><div class="bm-fill" style="width:${w}%; background:${r.col};"></div></div>
        <span class="bm-desc">${esc(desc)}</span>
      </div>
    `;
  }).join('');
}

function renderPsychPanel() {
  const p = DATA.psych || {};
  const stages = ['무관심', '의심', '불안', '공포', '항복·투매', '체념', '축적·회복'];
  document.getElementById('psychSubTitle').textContent = p['단계']
    ? `${p['날짜'] || ''} 13:00 측정 — «${p['제목'] || ''}» (${p['단계']} · ${p['대응'] || ''})`
    : '13:00 장중 군중심리 측정 대기 중';
  const stageHtml = stages.map((s, i) => {
    const isNow = (p['단계'] === s);
    const isSim = (previewStage === s && !isNow);
    return `<div class="st-box ${isNow ? 'now-zone' : ''} ${isSim ? 'sim-zone' : ''}" onclick="selectStagePreview('${s}')">
      <span class="num">${i+1}단계</span>${esc(s)}
      ${isNow ? `<br><small>● 오늘(${esc(p['대응'])})</small>` : (isSim ? `<br><small>▶ 시연중</small>` : `<br><small style="font-size:10px;color:#998d7d;">클릭 시연</small>`)}
    </div>`;
  }).join('');

  const histRows = (p['기록'] || []).map(h => `
    <tr>
      <td><b>${esc(h['날짜'])}</b></td>
      <td><b>${esc(h['단계'])}</b> (${esc(h['위치'])} · ${esc(h['대응'])})</td>
      <td>«${esc(h['제목'])}»</td>
      <td>${esc(h['한줄'])}</td>
    </tr>
  `).join('');

  document.getElementById('psychBody').innerHTML = `
    <div class="section-card">
      <div class="sc-head">
        <span class="sc-title"><span class="sc-dot"></span>7단계 군중심리 스펙트럼 — «주식명작극장이 맛의 비밀이다 개미의 고통! 객.관.적»</span>
      </div>
      <div class="stage-7-bar">${stageHtml}</div>
      <div class="lead-judgment">
        ${p['단계']
          ? `<b>«${esc(p['제목'] || '')}»</b> — ${esc(p['해설'] || '')}<br><span style="color:var(--green);"><b>판정 결론:</b> ${esc(p['한줄'] || '')}</span>`
          : `<span style="color:var(--muted);">아직 측정된 장중 군중심리 기록이 없습니다. 상단 단계 버튼을 클릭하면 디오라마 시연을 볼 수 있습니다.</span>`}
      </div>
    </div>
    ${p['비교그림'] ? `
      <div class="section-card">
        <div class="sc-head"><span class="sc-title"><span class="sc-dot" style="background:var(--blue);"></span>최근 4거래일 군중심리 명화 비교</span></div>
        <img src="${esc(p['비교그림'])}" style="width:100%; border-radius:6px; border:1px solid var(--line-strong);" alt="비교4일">
      </div>
    ` : ''}
    <div class="section-card">
      <div class="sc-head"><span class="sc-title"><span class="sc-dot"></span>최근 일자별 군중심리 측정 기록</span></div>
      <table class="clean-table">
        <thead><tr><th style="width:70px;">날짜</th><th style="width:170px;">단계 · 대응</th><th style="width:200px;">작품 제목</th><th>한줄 판정</th></tr></thead>
        <tbody>${histRows}</tbody>
      </table>
    </div>
  `;
}

function renderBucketsPanel() {
  const b = (DATA.buckets && DATA.buckets['주머니']) || {};
  const recent = (DATA.buckets && DATA.buckets['최근처방']) || [];
  const cols = [
    { key: '코어', title: '코어 (안파는기술)', bg: '#fce8b2' },
    { key: '현금흐름', title: '현금흐름 (배당=내공)', bg: '#ccebd7' },
    { key: '공격', title: '공격 (레버리지)', bg: '#fad7d4' },
    { key: '가드', title: '가드 (하락방어)', bg: '#d4e5fa' },
    { key: '기타', title: '기타 (피할 함정)', bg: '#e9ecef' }
  ];
  const badgeFor = side => side === '판다' ? 'pb-sell' : (side === '산다' ? 'pb-buy' : 'pb-avoid');

  const gridHtml = cols.map(c => {
    const items = (b[c.key] || []).map(it => `
      <div class="b5-item">
        <span class="pos-badge ${badgeFor(it['방향'])}">${esc(it['행동'])}</span>${esc(it['대상'])}
        <div style="font-size:11px; color:var(--muted); margin-top:2px;">최근 ${esc((it['날짜']||'').slice(5))} · ${it['횟수']}회</div>
      </div>
    `).join('') || '<div class="b5-item" style="color:var(--muted);">기록 없음</div>';
    return `<div class="b5-col"><div class="b5-head" style="background:${c.bg};">${c.title}</div>${items}</div>`;
  }).join('');

  const recRows = recent.map(r => {
    const hasScore = r['짝점수'] != null;
    const scoreHtml = hasScore
      ? `<span style="font-size:11.5px; color:${r['짝점수']>=50?'var(--green)':'var(--muted)'};">짝 ${r['짝점수']}%<br>대상 ${r['대상점수']||0}%</span>`
      : `<span style="color:var(--muted); font-size:11px;">-</span>`;
    const metaHtml = [
      r['원천'] ? `<div style="font-size:12px; color:#1864ab; margin-top:4px;"><b>[원천]</b> ${esc(r['원천'])}</div>` : '',
      r['신호'] ? `<div style="font-size:12px; color:#1f7a4c; margin-top:2px;"><b>[신호]</b> ${esc(r['신호'])}</div>` : ''
    ].join('');
    const cloneHtml = r['클론예측']
      ? `<div style="margin-top:5px; padding-top:4px; border-top:1px dashed #d6cfc2; color:#6c757d; font-size:12px;"><b>[클론 보조 예측]</b> ${esc(r['클론예측'])}</div>`
      : '';
    return `
      <tr>
        <td><b>${esc(r['날짜'])} ${esc(r['시각'])}</b><br><small>${esc(r['방'])}</small></td>
        <td>
          <div><b>[연화님 완역·처방]</b> ${esc(r['요약'])}</div>
          ${metaHtml}
          ${cloneHtml}
        </td>
        <td style="text-align:center;">${scoreHtml}</td>
      </tr>
    `;
  }).join('');

  document.getElementById('bucketsBody').innerHTML = `
    <div class="section-card">
      <div class="sc-head">
        <span class="sc-title"><span class="sc-dot"></span>교토삼굴 5대 주머니 실시간 종목 장부 (turn_gold.jsonl ${DATA.buckets ? DATA.buckets['총묶음수'] : 0}묶음)</span>
      </div>
      <div class="bucket-5-grid">${gridHtml}</div>
    </div>
    <div class="section-card">
      <div class="sc-head"><span class="sc-title"><span class="sc-dot" style="background:var(--green);"></span>연화님 최근 브리핑 전수 완역 & 포지션 기록 (원천 · 신호 · 판다/산다/피한다)</span></div>
      <table class="clean-table">
        <thead><tr><th style="width:105px;">시각 · 방</th><th>연화님 속뜻 완역 · 데이터 원천 · 신호 (보조: 클론 예측)</th><th style="width:90px; text-align:center;">보조지표</th></tr></thead>
        <tbody>${recRows}</tbody>
      </table>
    </div>
  `;
}

function renderDecoderPanel() {
  const list = DATA.decoder || [];
  const m = DATA.meta || {};
  const pr = DATA.principles || {};
  const rules = pr.rules || [];
  const gepa = pr.gepa || {};
  const oc = pr.outcomes || {};
  const aq = pr.ai_qa || {};

  const cloneSubTxt = (m['일치율결론'] != null && m['일치율결론'] !== '')
    ? `결론 ${m['일치율결론']}% · 틀 ${m['일치율틀'] != null ? m['일치율틀'] + '%' : '-'}`
    : '채점 대기 중';
  document.getElementById('decoderSubTitle').textContent =
    `실증 원리 · 사후 수익률 · AI 조련/문답 · 역발상 해독 (보조: 클론 일치율 ${cloneSubTxt})`;

  const filterModes = [
    { id: 'all', label: '전체 통합 보기' },
    { id: 'rules', label: '실증 규칙 · 수익률 · 오답 보정' },
    { id: 'cases', label: 'AI 조련 · 문답 · 역발상 해독' }
  ];
  const filterBarHtml = `
    <div class="dec-filter-bar">
      <div class="slot-pills">
        ${filterModes.map(fm => `<button class="slot-pill ${selectedDecoderFilter === fm.id ? 'active' : ''}" type="button" onclick="selectDecoderFilter('${fm.id}')">${fm.label}</button>`).join('')}
      </div>
      <span class="source-tag">코드 실증 R01~R10 · 사후 수익률 · GEPA C01~C06 · AI/문답 색인</span>
    </div>
  `;

  // [섹션 A] 100% 코드 실증 규칙 & 약점 보정 게이트 (R01~R10)
  const verdictCls = v => v === '승격' ? 'rv-pass' : (v === '약점보정' ? 'rv-warn' : (v === '기각' ? 'rv-drop' : 'rv-hold'));
  const passCnt = rules.filter(r => r['판정'] === '승격').length;
  const warnCnt = rules.filter(r => r['판정'] === '약점보정').length;
  const holdCnt = rules.length - passCnt - warnCnt;
  const rulesRowsHtml = rules.map(r => {
    const ho = r['홀드아웃_검증'] || {};
    const hoPass = ho['통과여부'] === true;
    const hoKnown = ho['통과여부'] === true || ho['통과여부'] === false;
    const hoBadge = hoKnown
      ? `<span class="rv-badge ${hoPass ? 'rv-pass' : 'rv-hold'}">${hoPass ? '홀드아웃 통과' : '홀드아웃 미통과'}</span>`
      : `<span class="rv-badge rv-hold">검증 대기</span>`;
    const hoSub = (isFinNum(ho['전반_지지율']) || isFinNum(ho['후반_지지율']))
      ? `<div style="font-size:11px; color:var(--muted); margin-top:2px;">전반 ${fmtRatioPct(ho['전반_지지율'])} → 후반 ${fmtRatioPct(ho['후반_지지율'])}</div>`
      : '';
    const retVal = r['수익률_20일_평균'];
    const retCol = isFinNum(retVal) ? (Number(retVal) >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--muted)';
    const retStr = isFinNum(retVal) ? fmtSignedPct(retVal, 2) : '-';
    const ceHtml = (r['반례'] || []).length
      ? `<div style="margin-top:4px; padding:4px 7px; background:#f8f5ed; border-left:2.5px solid #c9bba3; font-size:11.5px; color:#5a4e41;">` +
        (r['반례'] || []).map(c => `<div><b>[반례 ${esc(c['번호'] || '-')}]</b> ${esc((c['날짜'] || '').slice(5))} ${esc(c['요약'] || '')}</div>`).join('') +
        `</div>`
      : '';
    return `
      <tr>
        <td style="white-space:nowrap;">
          <b>${esc(r['id'])}</b> <span class="rv-badge ${verdictCls(r['판정'])}">${esc(r['판정'] || '대기')}</span>
          <div style="font-size:11px; color:var(--muted); margin-top:3px;">${esc(r['분류'] || '')}</div>
        </td>
        <td>
          <div style="font-weight:800; color:var(--ink);">${esc(r['이름'])}</div>
          <div style="font-size:12px; color:#3d3227; margin-top:2px;">[조건식] ${esc(r['조건식_설명'] || '-')}</div>
          ${ceHtml}
        </td>
        <td style="white-space:nowrap;">
          <b>${isFinNum(r['일치수']) ? Number(r['일치수']) : 0}/${isFinNum(r['발동수']) ? Number(r['발동수']) : 0}</b>
          <div style="font-size:12px; font-weight:700; color:#1f5e3b;">(${fmtRatioPct(r['지지율'])})</div>
        </td>
        <td style="white-space:nowrap;">
          <b style="color:${retCol};">${retStr}</b>
          <div style="font-size:11.5px; color:var(--muted);">승률 ${fmtRatioPct(r['승률_20일'])} · n=${isFinNum(r['수익률_표본수']) ? Number(r['수익률_표본수']) : 0}</div>
        </td>
        <td style="white-space:nowrap;">
          <div style="font-size:12px;"><b>p=${fmtPval(r['p_value'])}</b></div>
          <div style="margin-top:3px;">${hoBadge}</div>
          ${hoSub}
        </td>
      </tr>
    `;
  }).join('');

  const sectionAHtml = `
    <div class="section-card">
      <div class="sc-head">
        <span class="sc-title"><span class="sc-dot" style="background:var(--green);"></span>[섹션 A] 100% 코드 실증 규칙 & 약점 보정 게이트 (R01~R10)</span>
        <span class="sc-meta">${rules.length ? `승격 ${passCnt} · 약점보정 ${warnCnt} · 보류/기각 ${holdCnt} (전반/후반 홀드아웃 검증)` : 'verified_rules.jsonl 연동'}</span>
      </div>
      ${rules.length ? `
        <table class="clean-table">
          <thead>
            <tr>
              <th style="width:120px;">규칙 · 판정</th>
              <th>실증 규칙명 · 조건식 · 반례 표본</th>
              <th style="width:105px;">일치 (지지율)</th>
              <th style="width:135px;">20일 수익률 · 승률</th>
              <th style="width:140px;">p-value · 홀드아웃</th>
            </tr>
          </thead>
          <tbody>${rulesRowsHtml}</tbody>
        </table>
      ` : `<div style="color:var(--muted); font-size:13px; padding:6px 2px;">아직 집계된 코드 실증 규칙 데이터가 없습니다.</div>`}
    </div>
  `;

  // [섹션 B] 실시간 처방 사후 수익률 성적표 & GEPA 오답 클러스터 요약
  const ocAll = oc['전체'] || {};
  const ocH1 = ocAll['1일'] || {};
  const ocH5 = ocAll['5일'] || {};
  const ocH20 = ocAll['20일'] || {};
  const ocPairs = Object.entries(oc['주머니_방향별'] || {})
    .sort((a, b) => Number((b[1] && b[1]['건수']) || 0) - Number((a[1] && a[1]['건수']) || 0))
    .slice(0, 8);
  const fmtHCell = h => (h && isFinNum(h['평균']) && Number(h['표본수'] || 0) > 0)
    ? `<b style="color:${Number(h['평균']) >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtSignedPct(h['평균'], 2)}</b> <small style="color:var(--muted);">(${fmtRatioPct(h['승률'], 1)}, n=${Number(h['표본수'])})</small>`
    : `<span style="color:var(--muted); font-size:11.5px;">종가 대기</span>`;
  const pairRowsHtml = ocPairs.map(([pairKey, st]) => `
    <tr>
      <td><b>${esc(pairKey)}</b> <small style="color:var(--muted);">(${Number(st['건수'] || 0)}건)</small></td>
      <td>${fmtHCell(st['1일'])}</td>
      <td>${fmtHCell(st['5일'])}</td>
      <td>${fmtHCell(st['20일'])}</td>
    </tr>
  `).join('');

  const clusters = gepa['오답_클러스터'] || [];
  const clusterItemsHtml = clusters.map(cl => `
    <div class="ins-item" style="border-left:3.5px solid #b35c00; background:#fffdf9; padding:9px 12px;">
      <div class="ins-top" style="flex-wrap:wrap;">
        <span class="rv-badge rv-warn">${esc(cl['id'] || 'C')} · 완전오답 ${Number(cl['완전오답_건수'] || 0)}건</span>
        <span style="font-weight:800; font-size:13px; color:var(--ink);">${esc(cl['이름'] || '')}</span>
      </div>
      <div style="font-size:12.3px; color:#3d3227; margin-top:4px;"><b>[가드레일]</b> ${esc(cl['가드레일'] || '-')}</div>
    </div>
  `).join('');

  const sectionBHtml = `
    <div class="section-card">
      <div class="sc-head">
        <span class="sc-title"><span class="sc-dot" style="background:var(--gold);"></span>[섹션 B] 실시간 처방 사후 수익률 성적표 & GEPA 오답 클러스터 요약</span>
        <span class="sc-meta">실시간 T26* 방향맞춘 수익률 · 클론 6대 오답 가드레일</span>
      </div>
      ${Number(oc['채점_항목수'] || 0) > 0 ? `
        <div class="pos-grid" style="margin-bottom:10px;">
          <div class="pos-box" style="background:#f8faf9;">
            <div style="font-weight:800; color:var(--ink); margin-bottom:4px;">실시간 처방 채점 규모</div>
            <div>총 처방 <b>${Number(oc['처방_묶음수'] || 0)}묶음</b> 중 종가 확정 <b>${Number(oc['채점_묶음수'] || 0)}묶음 (${Number(oc['채점_항목수'] || 0)}종목)</b></div>
          </div>
          <div class="pos-box" style="border:1.5px solid #a9dfc0; background:#f3faf5;">
            <div style="font-weight:800; color:var(--green); margin-bottom:4px;">1거래일 방향맞춘 성적</div>
            <div>평균 <b>${isFinNum(ocH1['평균']) ? fmtSignedPct(ocH1['평균'], 2) : '-'}</b> · 승률 <b>${fmtRatioPct(ocH1['승률'], 1)}</b> <small style="color:var(--muted);">(n=${Number(ocH1['표본수'] || 0)})</small></div>
          </div>
          <div class="pos-box" style="border:1.5px solid #adcbf0; background:#f2f7fd;">
            <div style="font-weight:800; color:var(--blue); margin-bottom:4px;">5거래일 방향맞춘 성적</div>
            <div>평균 <b>${isFinNum(ocH5['평균']) ? fmtSignedPct(ocH5['평균'], 2) : '-'}</b> · 승률 <b>${fmtRatioPct(ocH5['승률'], 1)}</b> <small style="color:var(--muted);">(n=${Number(ocH5['표본수'] || 0)}${Number(ocH20['표본수'] || 0) > 0 ? ` · 20일 n=${Number(ocH20['표본수'])}` : ''})</small></div>
          </div>
        </div>
        ${pairRowsHtml ? `
          <table class="clean-table" style="margin-bottom:14px;">
            <thead><tr><th>주머니 · 방향 (표본)</th><th>1거래일 방향맞춘 수익률</th><th>5거래일 방향맞춘 수익률</th><th>20거래일 방향맞춘 수익률</th></tr></thead>
            <tbody>${pairRowsHtml}</tbody>
          </table>
        ` : ''}
      ` : `<div style="color:var(--muted); font-size:12.5px; margin-bottom:12px;">아직 종가 확정된 실시간 처방 사후 수익률 데이터가 없습니다.</div>`}
      <div style="border-top:1px solid var(--line); padding-top:10px;">
        <div class="stat-pill-row">
          <span class="stat-pill">GEPA 채점: <b>${Number(gepa['전체_채점건수'] || 0)}건</b></span>
          <span class="stat-pill">완전오답: <b style="color:var(--red);">${Number(gepa['완전오답_건수'] || 0)}건</b></span>
          <span class="stat-pill">평균 짝 F1: <b>${fmtRatioPct(gepa['평균_짝_F1'], 1)}</b></span>
          <span class="stat-pill">평균 대상 F1: <b>${fmtRatioPct(gepa['평균_대상_F1'], 1)}</b></span>
        </div>
        ${clusters.length ? `<div class="insight-list">${clusterItemsHtml}</div>` : `<div style="color:var(--muted); font-size:12.5px;">아직 집계된 GEPA 오답 클러스터 데이터가 없습니다.</div>`}
      </div>

function svgSpark(arr, w = 74, h = 22) {
  if (!arr || arr.length < 2) return '<span style="color:#adb5bd; font-size:11px;">-</span>';
  const min = Math.min(...arr);
  const max = Math.max(...arr);
  const span = (max - min) || 1;
  const pts = arr.map((v, i) => {
    const x = ((i / (arr.length - 1)) * (w - 4) + 2).toFixed(1);
    const y = (h - 3 - ((v - min) / span) * (h - 6)).toFixed(1);
    return `${x},${y}`;
  }).join(' ');
  const col = arr[arr.length - 1] >= arr[0] ? '#1f7a4c' : '#2b4470';
  return `<svg width="${w}" height="${h}" style="vertical-align:middle;"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
}

const READER_BODY_IDS = ['insightBody', 'psychBody', 'bucketsBody', 'dividendBody', 'decoderBody', 'pmBody', 'reportsBody'];

function detailIdentity(detEl, idx) {
  const explicitKey = detEl.getAttribute('data-detail-key');
  if (explicitKey) return 'key:' + explicitKey;
  const sumEl = detEl.querySelector('summary');
  const sumTxt = sumEl ? sumEl.textContent.trim().replace(/\s+/g, ' ') : '';
  return sumTxt ? ('sum:' + sumTxt) : ('idx:' + idx);
}

function captureUiState() {
  const panels = {};
  READER_BODY_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const openKeys = new Set();
    const openIndices = new Set();
    el.querySelectorAll('details').forEach((det, idx) => {
      if (det.open) {
        openKeys.add(detailIdentity(det, idx));
        openIndices.add(idx);
      }
    });
    panels[id] = {
      scrollTop: el.scrollTop,
      scrollLeft: el.scrollLeft,
      openKeys,
      openIndices
    };
  });
  return {
    winX: window.scrollX || 0,
    winY: window.scrollY || 0,
    panels
  };
}

function restoreUiState(snapshot) {
  if (!snapshot) return;
  READER_BODY_IDS.forEach(id => {
    const el = document.getElementById(id);
    const saved = snapshot.panels[id];
    if (!el || !saved) return;
    el.querySelectorAll('details').forEach((det, idx) => {
      const ident = detailIdentity(det, idx);
      if (saved.openKeys.has(ident) || (!det.getAttribute('data-detail-key') && saved.openIndices.has(idx))) {
        det.open = true;
      }
    });
    el.scrollTop = saved.scrollTop;
    el.scrollLeft = saved.scrollLeft;
  });
  if (snapshot.winX || snapshot.winY) {
    window.scrollTo(snapshot.winX, snapshot.winY);
  }
}

function renderAll(preserveState = true) {
  const snapshot = preserveState ? captureUiState() : null;
  renderTopBar();
  renderInsightPanel();
  renderPsychPanel();
  renderBucketsPanel();
  renderDividendPanel();
  renderDecoderPanel();
  renderPolymarketPanel();
  renderReportsPanel();
  if (snapshot) restoreUiState(snapshot);
}
renderAll(false);

let lastPollTs = Date.now();
async function pollLive() {
  if (!location.protocol.startsWith('http') || location.hostname.endsWith('github.io') || document.hidden) {
    updateSyncBadge();
    return;
  }
  try {
    const r = await fetch('/api/state?light=1', { cache: 'no-store' });
    if (r.ok) {
      const next = await r.json();
      const oldImgById = {};
      (DATA.insights || []).forEach(it => { if (it['차트']) oldImgById[it.id] = it['차트']; });
      (next.insights || []).forEach(it => { if (!it['차트'] && oldImgById[it.id]) it['차트'] = oldImgById[it.id]; });
      if (next.psych && DATA.psych) {
        if (!next.psych['비교그림']) next.psych['비교그림'] = DATA.psych['비교그림'];
        if (!next.psych['오늘그림']) next.psych['오늘그림'] = DATA.psych['오늘그림'];
      }
      DATA = next;
      isLiveServer = true;
      lastLiveOkTs = Date.now();
      lastPollTs = Date.now();
      renderAll(true);
    } else {
      isLiveServer = false;
      updateSyncBadge();
    }
  } catch (err) {
    isLiveServer = false;
    updateSyncBadge();
  }
}

/* ── 7-ROOM KAIROSOFT PIXEL DIORAMA ENGINE (HiDPI + Offscreen Tile Cache + 15fps Retro Tick + Real State Packet) ── */
const cvs = document.getElementById('dioramaCanvas');
const c = cvs.getContext('2d');
const LOGICAL_W = 440;
const LOGICAL_H = 330;
const FRAME_INTERVAL_MS = 66; // 15fps retro tick (eliminates 60fps battery/thermal drain)

const ROOMS = {
  insight:  { id: 'insight',  label: '① 실전 지침',   x: 0.02, y: 0.03, w: 0.47, h: 0.30, floorA: '#f3e5ab', floorB: '#ebd892', wall: '#d9c29c' },

  dividend: { id: 'dividend', label: '④ 배당 시트',   x: 0.35, y: 0.36, w: 0.30, h: 0.30, floorA: '#d9f2e6', floorB: '#c8ebd9', wall: '#9ecfb8' },
  decoder:  { id: 'decoder',  label: '⑤ 역발상 판독', x: 0.67, y: 0.36, w: 0.31, h: 0.30, floorA: '#e3edf7', floorB: '#d5e3f0', wall: '#b0c4de' },
  stats:    { id: 'stats',    label: '⑥ 예측시장',    x: 0.02, y: 0.69, w: 0.47, h: 0.28, floorA: '#d8f3dc', floorB: '#c7ebd0', wall: '#95d5b2' },
  reports:  { id: 'reports',  label: '⑦ 리포트',      x: 0.51, y: 0.69, w: 0.47, h: 0.28, floorA: '#efe7d6', floorB: '#e4dac4', wall: '#c7b89c' }
};

let tick = 0;
let packetProgress = 0;
let cachedDpr = 0;
let bgCanvas = null;

function roomGeom(rm) {
  return {
    rx: Math.round(rm.x * LOGICAL_W),
    ry: Math.round(rm.y * LOGICAL_H),
    rw: Math.round(rm.w * LOGICAL_W),
    rh: Math.round(rm.h * LOGICAL_H),
    wallH: 20
  };
}

function ensureBgCache(dpr) {
  if (bgCanvas && cachedDpr === dpr) return;
  cachedDpr = dpr;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.round(LOGICAL_W * dpr);
  bgCanvas.height = Math.round(LOGICAL_H * dpr);
  const bc = bgCanvas.getContext('2d');
  bc.setTransform(dpr, 0, 0, dpr, 0, 0);
  bc.imageSmoothingEnabled = false;

  // Hallway corridor base
  bc.fillStyle = '#d8ccb8';
  bc.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  bc.strokeStyle = 'rgba(90, 70, 50, 0.13)';
  bc.lineWidth = 1;
  for (let gx = 0; gx < LOGICAL_W; gx += 16) { bc.beginPath(); bc.moveTo(gx, 0); bc.lineTo(gx, LOGICAL_H); bc.stroke(); }
  for (let gy = 0; gy < LOGICAL_H; gy += 16) { bc.beginPath(); bc.moveTo(0, gy); bc.lineTo(LOGICAL_W, gy); bc.stroke(); }

  // Corridor connection tracks
  bc.strokeStyle = '#b59f7c';
  bc.lineWidth = 5;
  bc.beginPath();
  bc.moveTo(LOGICAL_W * 0.24, LOGICAL_H * 0.33);
  bc.lineTo(LOGICAL_W * 0.24, LOGICAL_H * 0.36);
  bc.moveTo(LOGICAL_W * 0.33, LOGICAL_H * 0.51);
  bc.lineTo(LOGICAL_W * 0.35, LOGICAL_H * 0.51);
  bc.moveTo(LOGICAL_W * 0.65, LOGICAL_H * 0.51);
  bc.lineTo(LOGICAL_W * 0.67, LOGICAL_H * 0.51);
  bc.stroke();

  // Static walls, wainscot strips, and checkered floor tiles for all 7 rooms
  Object.values(ROOMS).forEach(rm => {
    const g = roomGeom(rm);
    bc.fillStyle = 'rgba(26, 20, 14, 0.16)';
    bc.fillRect(g.rx + 3, g.ry + 3, g.rw, g.rh);
    bc.fillStyle = rm.wall;
    bc.fillRect(g.rx, g.ry, g.rw, g.wallH);
    bc.fillStyle = '#8b5a2b';
    bc.fillRect(g.rx, g.ry + g.wallH - 4, g.rw, 4);
    const tile = 12;
    for (let ty = g.ry + g.wallH; ty < g.ry + g.rh; ty += tile) {
      for (let tx = g.rx; tx < g.rx + g.rw; tx += tile) {
        const even = ((Math.floor((tx - g.rx) / tile) + Math.floor((ty - g.ry) / tile)) % 2 === 0);
        bc.fillStyle = even ? rm.floorA : rm.floorB;
        bc.fillRect(tx, ty, Math.min(tile, g.rx + g.rw - tx), Math.min(tile, g.ry + g.rh - ty));
      }
    }
    bc.strokeStyle = '#3d2f24';
    bc.lineWidth = 1.8;
    bc.strokeRect(g.rx, g.ry, g.rw, g.rh);
  });
}

function drawPixelSpeech(x, y, text, bg, fg = '#fff') {
  c.font = "9.5px 'DungGeunMo', monospace";
  const tw = Math.round(c.measureText(text).width + 7);
  const bx = Math.max(2, Math.min(LOGICAL_W - tw - 2, Math.round(x - tw / 2)));
  const by = Math.max(2, Math.round(y - 12));
  c.fillStyle = bg;
  c.fillRect(bx, by, tw, 12);
  c.strokeStyle = '#1a1410';
  c.lineWidth = 1.1;
  c.strokeRect(bx, by, tw, 12);
  c.fillStyle = bg;
  c.fillRect(Math.round(x - 2), by + 12, 4, 2);
  c.fillStyle = fg;
  c.textAlign = 'center';
  c.fillText(text, Math.round(bx + tw / 2), by + 9);
}

function drawKairoSprite(x, y, cfg) {
  const px = Math.round(x);
  const py = Math.round(y);
  const pose = cfg.pose || 'stand';
  const suit = cfg.suit || '#2b579a';
  const hair = cfg.hair || '#241c15';
  const skin = cfg.pale ? '#cfe8ff' : '#ffd8a8';
  const walkCycle = Math.sin(tick * (cfg.freq || 0.35) + (cfg.phase || 0));
  const bob = (pose === 'walk' || pose === 'panic' || pose === 'cheer') ? Math.abs(walkCycle) * (pose === 'panic' ? 3.0 : 1.8) : 0;
  const jit = (pose === 'shiver' || pose === 'panic') ? Math.sin(tick * 1.4 + (cfg.phase || 0)) * (pose === 'panic' ? 2.2 : 1.1) : 0;
  const gx = Math.round(px + jit);
  const gy = Math.round(py - bob);

  c.fillStyle = 'rgba(20, 15, 10, 0.24)';
  c.beginPath();
  c.ellipse(px, py + 2, pose === 'otl' ? 9 : 7, 3, 0, 0, Math.PI * 2);
  c.fill();

  if (pose === 'otl') {
    c.fillStyle = '#1e2229';
    c.fillRect(gx - 8, gy - 4, 6, 4);
    c.fillStyle = suit;
    c.fillRect(gx - 4, gy - 9, 9, 6);
    c.strokeStyle = '#1a1410'; c.lineWidth = 1.1;
    c.strokeRect(gx - 4, gy - 9, 9, 6);
    c.fillStyle = skin;
    c.fillRect(gx + 4, gy - 4, 3, 4);
    c.fillRect(gx + 2, gy - 11, 8, 7);
    c.strokeRect(gx + 2, gy - 11, 8, 7);
    c.fillStyle = hair;
    c.fillRect(gx + 2, gy - 13, 8, 3);
    c.fillStyle = '#4dabf7';
    c.fillRect(gx + 6, gy - 4, 2, 4);
    if (cfg.tag) drawPixelSpeech(gx, gy - 16, cfg.tag, cfg.tagBg || '#c92a2a');
    return;
  }

  c.fillStyle = '#1f242d';
  const legOff = (pose === 'walk' || pose === 'panic') ? Math.round(walkCycle * 2) : 0;
  if (pose !== 'sit') {
    c.fillRect(gx - 4, gy - 4 + (legOff > 0 ? -1 : 0), 3, 4);
    c.fillRect(gx + 1, gy - 4 + (legOff < 0 ? -1 : 0), 3, 4);
  } else {
    c.fillRect(gx - 4, gy - 3, 8, 3);
  }

  const slumpY = (pose === 'slump') ? 2 : 0;
  c.fillStyle = suit;
  c.fillRect(gx - 6, gy - 13 + slumpY, 12, 9);
  c.strokeStyle = '#1a1410'; c.lineWidth = 1.1;
  c.strokeRect(gx - 6, gy - 13 + slumpY, 12, 9);
  c.fillStyle = '#ffffff';
  c.fillRect(gx - 2, gy - 13 + slumpY, 4, 3);
  c.fillStyle = cfg.tie || '#e03131';
  c.fillRect(gx - 1, gy - 11 + slumpY, 2, 4);

  c.fillStyle = suit;
  if (pose === 'panic' || pose === 'cheer') {
    const wave = Math.round(Math.sin(tick * 0.65 + (cfg.phase || 0)) * 2);
    c.fillRect(gx - 9, gy - 18 + wave, 3, 7);
    c.fillRect(gx + 6, gy - 18 - wave, 3, 7);
  } else if (pose === 'phone') {
    c.fillRect(gx - 8, gy - 12, 2, 5);
    c.fillRect(gx + 5, gy - 13, 3, 4);
    c.fillStyle = (tick % 8 < 4) ? '#ff6b6b' : '#4dabf7';
    c.fillRect(gx + 7, gy - 16, 4, 6);
  } else {
    c.fillRect(gx - 8, gy - 12 + slumpY, 2, 6);
    c.fillRect(gx + 6, gy - 12 + slumpY, 2, 6);
  }

  const headY = gy - 23 + slumpY;
  c.fillStyle = skin;
  c.fillRect(gx - 6, headY, 12, 10);
  c.strokeRect(gx - 6, headY, 12, 10);
  c.fillStyle = hair;
  c.fillRect(gx - 7, headY - 2, 14, 3);
  c.fillRect(gx - 7, headY, 2, 3);
  c.fillRect(gx + 5, headY, 2, 3);

  if (cfg.glasses) {
    c.fillStyle = '#1a1410';
    c.fillRect(gx - 5, headY + 3, 4, 3);
    c.fillRect(gx + 1, headY + 3, 4, 3);
    c.fillStyle = '#a5d8ff';
    c.fillRect(gx - 4, headY + 4, 2, 1.5);
    c.fillRect(gx + 2, headY + 4, 2, 1.5);
  } else {
    c.fillStyle = '#1a1410';
    c.fillRect(gx - 4, headY + 4, 2, 2);
    c.fillRect(gx + 2, headY + 4, 2, 2);
  }

  if (cfg.sweat > 0) {
    c.fillStyle = '#339af0';
    for (let s = 0; s < cfg.sweat; s++) {
      const sy = (tick * 0.9 + s * 3) % 7;
      c.fillRect(gx + 8 + (s % 2) * 2, headY + sy, 2, 3);
    }
  }

  if (cfg.aura) {
    c.fillStyle = '#fcc419';
    const ay = Math.round(Math.sin(tick * 0.3) * 2);
    c.fillRect(gx - 9, headY - 1 + ay, 2.5, 2.5);
    c.fillRect(gx + 7, headY + 1 - ay, 2.5, 2.5);
  }

  if (cfg.tag) {
    drawPixelSpeech(gx, headY - 4, cfg.tag, cfg.tagBg || '#241c15', cfg.tagFg || '#fff');
  }
}

let dioramaRafId = null;
let lastFrameTs = 0;

function renderDiorama(nowTs) {
  dioramaRafId = null;
  if (document.hidden || dioramaCollapsed) return;
  if (nowTs && (nowTs - lastFrameTs < FRAME_INTERVAL_MS)) {
    dioramaRafId = requestAnimationFrame(renderDiorama);
    return;
  }
  lastFrameTs = nowTs || performance.now();
  tick++;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const targetW = Math.round(LOGICAL_W * dpr);
  const targetH = Math.round(LOGICAL_H * dpr);
  if (cvs.width !== targetW || cvs.height !== targetH) {
    cvs.width = targetW;
    cvs.height = targetH;
  }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.imageSmoothingEnabled = false;

  ensureBgCache(dpr);
  c.drawImage(bgCanvas, 0, 0, LOGICAL_W, LOGICAL_H);

  const stName = currentStageName();
  const stSpec = currentStageSpec();
  const step = stSpec.step;
  const cs = activeCoinSpec();
  const pmStale = !!(DATA && DATA.polymarket && DATA.polymarket['지연']);

  // Highlight currently selected tab's room in double gold border
  const actRoom = ROOMS[activeTab];
  if (actRoom) {
    const ag = roomGeom(actRoom);
    c.strokeStyle = '#e6a817';
    c.lineWidth = 3;
    c.strokeRect(ag.rx, ag.ry, ag.rw, ag.rh);
    c.strokeStyle = '#241c15';
    c.lineWidth = 1;
    c.strokeRect(ag.rx - 2, ag.ry - 2, ag.rw + 4, ag.rh + 4);
  }

  // ROOM 1: ① 완역 지휘실 (tab: insight)
  const r1 = roomGeom(ROOMS.insight);
  c.fillStyle = '#1e293b';
  c.fillRect(r1.rx + 10, r1.ry + 3, 40, 13);
  c.strokeStyle = '#38d9a9'; c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(r1.rx + 13, r1.ry + 13);
  c.lineTo(r1.rx + 23, r1.ry + 9);
  c.lineTo(r1.rx + 35, r1.ry + 11);
  c.lineTo(r1.rx + 46, r1.ry + 6);
  c.stroke();

  const yx = r1.rx + r1.rw * 0.54;
  const yy = r1.ry + r1.rh - 18;
  const cloneTagByStep = {
    0: '완역 관제 중',
    1: '1단계 무관심 점검',
    2: '2단계 의심 관측',
    3: '3단계 불안 분할준비',
    4: '4단계 공포 홀드',
    5: '5단계 투매 매집!',
    6: '6단계 체념 보유',
    7: '7단계 회복 순환'
  };
  drawKairoSprite(yx, yy, {
    pose: 'sit', suit: '#1f5e3b', hair: '#1a1410', tie: '#e6a817',
    glasses: true, aura: true,
    tag: cloneTagByStep[step] || '완역 관제', tagBg: '#1f5e3b'
  });
  c.fillStyle = '#6b4226';
  c.fillRect(yx - 26, yy - 5, 52, 12);
  c.strokeStyle = '#241c15'; c.lineWidth = 1.2;
  c.strokeRect(yx - 26, yy - 5, 52, 12);
  drawKairoSprite(r1.rx + 26, r1.ry + r1.rh - 14, {
    pose: 'sit', suit: '#3b5bdb', hair: '#5c3c1e', glasses: true,
    tag: 'DART·차트 대조', tagBg: '#2b4470'
  });

  // ROOM 2: ② 13시 명작극장 (tab: psych — 100% matched with STAGE_SPECS names)
  const r2 = roomGeom(ROOMS.psych);
  const stageTint = {
    0: 'rgba(180, 175, 165, 0.08)',
    1: 'rgba(180, 175, 165, 0.14)',
    2: 'rgba(255, 212, 59, 0.08)',
    3: 'rgba(255, 146, 43, 0.12)',
    4: 'rgba(250, 82, 82, 0.14)',
    5: (tick % 10 < 5) ? 'rgba(224, 49, 49, 0.22)' : 'rgba(224, 49, 49, 0.10)',
    6: 'rgba(73, 80, 87, 0.24)',
    7: 'rgba(64, 192, 87, 0.12)'
  }[step];
  if (stageTint) {
    c.fillStyle = stageTint;
    c.fillRect(r2.rx + 1, r2.ry + 1, r2.rw - 2, r2.rh - 2);
  }
  for (let f = 0; f < 3; f++) {
    const fx = r2.rx + 14 + f * Math.round((r2.rw - 44) / 2.2);
    const fy = r2.ry + 3;
    c.fillStyle = '#d4af37';
    c.fillRect(fx, fy, 28, 14);
    c.fillStyle = (step === 4 || step === 5) ? '#4a1515' : (step === 7 ? '#133b26' : '#1e293b');
    c.fillRect(fx + 2, fy + 2, 24, 10);
  }
  const gx0 = r2.rx + r2.rw * 0.25;
  const gx1 = r2.rx + r2.rw * 0.52;
  const gx2 = r2.rx + r2.rw * 0.78;
  const gyMid = r2.ry + r2.rh - 16;

  if (step === 0) {
    drawKairoSprite(gx1, gyMid, { pose: 'stand', suit: '#6c757d', tag: '13시 측정 대기', tagBg: '#495057' });
  } else if (step === 1) {
    drawKairoSprite(gx0 + Math.sin(tick * 0.06) * 14, gyMid, { pose: 'walk', freq: 0.15, suit: '#6c757d', tag: '1단계 무관심', tagBg: '#495057' });
    drawKairoSprite(gx2, gyMid + 2, { pose: 'sit', suit: '#495057' });
  } else if (step === 2) {
    drawKairoSprite(gx0, gyMid, { pose: 'stand', suit: '#3b5bdb', tag: '2단계 의심 (?)', tagBg: '#b8860b' });
    drawKairoSprite(gx2, gyMid, { pose: 'phone', suit: '#2b8a3e' });
  } else if (step === 3) {
    drawKairoSprite(gx0 + Math.sin(tick * 0.18) * 8, gyMid, { pose: 'phone', sweat: 1, suit: '#3b5bdb', tag: '3단계 불안 (!)', tagBg: '#d9480f' });
    drawKairoSprite(gx2 - Math.sin(tick * 0.2) * 8, gyMid, { pose: 'walk', sweat: 1, suit: '#495057' });
  } else if (step === 4) {
    drawKairoSprite(gx0 + 8, gyMid, { pose: 'shiver', pale: true, sweat: 2, suit: '#3b5bdb', tag: '4단계 공포 (!!)', tagBg: '#c92a2a' });
    drawKairoSprite(gx2 - 8, gyMid, { pose: 'shiver', pale: true, sweat: 2, phase: 2, suit: '#495057' });
  } else if (step === 5) {
    drawKairoSprite(gx0 + Math.sin(tick * 0.35) * 14, gyMid, { pose: 'panic', pale: true, sweat: 3, suit: '#c92a2a', tag: '5단계 항복·투매!', tagBg: '#c92a2a' });
    drawKairoSprite(gx1 + 10, gyMid + 4, { pose: 'otl', pale: true, suit: '#3b5bdb' });
  } else if (step === 6) {
    drawKairoSprite(gx0 + 6, gyMid + 2, { pose: 'slump', suit: '#495057', tag: '6단계 체념 (...)', tagBg: '#343a40' });
    drawKairoSprite(gx2 - 6, gyMid + 2, { pose: 'slump', suit: '#343a40' });
  } else if (step === 7) {
    drawKairoSprite(gx0 + 6, gyMid, { pose: 'cheer', aura: true, suit: '#2b8a3e', tag: '7단계 축적·회복!', tagBg: '#2b8a3e' });
    drawKairoSprite(gx2 - 6, gyMid, { pose: 'cheer', aura: true, phase: 2, suit: '#1971c2' });
  }

  // ROOM 3: ③ 5대 주머니 금고 (tab: buckets)
  const r3 = roomGeom(ROOMS.buckets);
  const safeColors = ['#e6a817', '#1f7a4c', '#c93b2b', '#1971c2'];
  safeColors.forEach((scCol, idx) => {
    const sx = r3.rx + 8 + idx * 31;
    const sy = r3.ry + r3.wallH + 5;
    c.fillStyle = '#343a40';
    c.fillRect(sx, sy, 26, 24);
    c.strokeStyle = '#1a1410'; c.lineWidth = 1.2;
    c.strokeRect(sx, sy, 26, 24);
    c.fillStyle = scCol;
    c.fillRect(sx + 2, sy + 2, 22, 6);
  });
  drawKairoSprite(r3.rx + r3.rw * 0.5, r3.ry + r3.rh - 13, {
    pose: cs.mode === 'hold' ? 'stand' : 'walk',
    suit: '#2b4470', tie: '#fcc419',
    tag: cs.badge, tagBg: cs.mode === 'hold' ? '#495057' : '#b8860b'
  });

  // ROOM 4: ④ 배당·주버드콜 (tab: dividend — newly added 1:1 room!)
  const r4 = roomGeom(ROOMS.dividend);
  c.fillStyle = '#ffffff';
  c.fillRect(r4.rx + 14, r4.ry + r4.wallH + 4, r4.rw - 28, 22);
  c.strokeStyle = '#1f7a4c'; c.lineWidth = 1.3;
  c.strokeRect(r4.rx + 14, r4.ry + r4.wallH + 4, r4.rw - 28, 22);
  for (let cal = 0; cal < 4; cal++) {
    c.fillStyle = cal % 2 === 0 ? '#b7e1cd' : '#c9daf8';
    c.fillRect(r4.rx + 18 + cal * 24, r4.ry + r4.wallH + 8, 20, 14);
  }
  drawKairoSprite(r4.rx + r4.rw * 0.5, r4.ry + r4.rh - 13, {
    pose: 'sit', suit: '#1f7a4c', glasses: true,
    tag: '배당42·주버드24', tagBg: '#1f7a4c'
  });

  // ROOM 5: ⑤ 역발상 판독실 (tab: decoder)
  const r5 = roomGeom(ROOMS.decoder);
  const dx = r5.rx + r5.rw * 0.5;
  const dy = r5.ry + r5.rh - 14;
  drawKairoSprite(dx - 24, dy, { pose: 'sit', suit: '#495057', glasses: true, tag: '언론프레임', tagBg: '#495057' });
  drawKairoSprite(dx + 24, dy, { pose: 'sit', suit: '#1864ab', glasses: true, tag: '본질역발상', tagBg: '#1864ab' });

  // ROOM 6: ⑥ 예측시장 서버 (tab: stats — '금리·확률 감시' 1:1 매핑)
  const r6 = roomGeom(ROOMS.stats);
  for (let sr = 0; sr < 3; sr++) {
    const sx = r6.rx + 12 + sr * 34;
    const sy = r6.ry + r6.wallH + 5;
    c.fillStyle = '#212529';
    c.fillRect(sx, sy, 26, 28);
    for (let row = 0; row < 3; row++) {
      c.fillStyle = pmStale ? '#f59f00' : (((tick + sr * 3 + row * 5) % 8 < 4) ? '#51cf66' : '#4dabf7');
      c.fillRect(sx + 4, sy + 5 + row * 7, 18, 3);
    }
  }
  drawKairoSprite(r6.rx + r6.rw * 0.72, r6.ry + r6.rh - 13, {
    pose: 'stand', suit: '#0ca678', glasses: true,
    tag: pmStale ? '스냅샷 대기' : '금리·확률 감시',
    tagBg: pmStale ? '#b35c00' : '#099268'
  });

  // ROOM 7: ⑦ 글로벌 브리핑 (tab: reports — newly added 1:1 room + DOUGHCON status!)
  const r7 = roomGeom(ROOMS.reports);
  c.fillStyle = '#1e1914';
  c.fillRect(r7.rx + 14, r7.ry + r7.wallH + 5, 58, 26);
  c.strokeStyle = '#e6a817'; c.lineWidth = 1.2;
  c.strokeRect(r7.rx + 14, r7.ry + r7.wallH + 5, 58, 26);
  c.fillStyle = '#69db7c';
  c.fillRect(r7.rx + 19, r7.ry + r7.wallH + 10, 36, 3);
  c.fillStyle = '#ffd43b';
  c.fillRect(r7.rx + 19, r7.ry + r7.wallH + 17, 46, 3);
  const pizzaSpike = !!(DATA && DATA.meta && DATA.meta['피자급증']);
  drawKairoSprite(r7.rx + r7.rw * 0.68, r7.ry + r7.rh - 13, {
    pose: 'sit', suit: '#5c4d3c', glasses: true,
    tag: pizzaSpike ? '피자급증 경보!' : '08:36·09:10 브리핑',
    tagBg: pizzaSpike ? '#c92a2a' : '#5c4d3c'
  });

  // ROOM SIGNBOARDS (All 7 rooms)
  c.font = "10.5px 'DungGeunMo', monospace";
  Object.values(ROOMS).forEach(rm => {
    const isAct = (rm.id === activeTab);
    const x = Math.round((rm.x + rm.w / 2) * LOGICAL_W);
    const y = Math.round(rm.y * LOGICAL_H + 8);
    const labelTxt = rm.id === 'psych'
      ? (step > 0 ? `② 명작극장 [${stSpec.step}:${stName}]` : '② 명작극장 [대기]')
      : rm.label;
    const tw = Math.round(c.measureText(labelTxt).width + 10);
    c.fillStyle = isAct ? '#e6a817' : '#241c15';
    c.fillRect(x - tw / 2, y - 8, tw, 15);
    c.strokeStyle = isAct ? '#241c15' : '#e6a817';
    c.lineWidth = 1.2;
    c.strokeRect(x - tw / 2, y - 8, tw, 15);
    c.fillStyle = isAct ? '#241c15' : '#ffffff';
    c.textAlign = 'center';
    c.fillText(labelTxt, x, y + 3);
  });

  // REAL DATA-DRIVEN PACKET (only moves when actual buy/sell prescriptions exist in selected slot!)
  if (cs.mode !== 'hold') {
    packetProgress = (packetProgress + 0.04) % 1;
    const px = LOGICAL_W * (cs.sx + (cs.tx - cs.sx) * packetProgress);
    const py = LOGICAL_H * (cs.sy + (cs.ty - cs.sy) * packetProgress);
    c.fillStyle = '#fcc419';
    c.fillRect(px - 5, py - 5, 10, 10);
    c.strokeStyle = '#1a1410'; c.lineWidth = 1.2;
    c.strokeRect(px - 5, py - 5, 10, 10);
    drawPixelSpeech(px, py - 4, cs.badge, '#241c15', '#ffe066');
  }

  if (!document.hidden && !dioramaCollapsed && dioramaRafId === null) {
    dioramaRafId = requestAnimationFrame(renderDiorama);
  }
}

function startDioramaLoop() {
  if (!document.hidden && !dioramaCollapsed && dioramaRafId === null) {
    dioramaRafId = requestAnimationFrame(renderDiorama);
  }
}

function stopDioramaLoop() {
  if (dioramaRafId !== null) {
    cancelAnimationFrame(dioramaRafId);
    dioramaRafId = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopDioramaLoop();
  } else {
    startDioramaLoop();
    if (Date.now() - lastPollTs >= 30000) {
      pollLive();
    }
  }
});

// Auto-collapse diorama on narrow mobile viewports (pixel-agents #404 mobile view pattern)
if (window.innerWidth <= 680) {
  toggleDiorama(true);
} else {
  startDioramaLoop();
}

cvs.addEventListener('click', e => {
  const rect = cvs.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top) / rect.height;
  for (const rm of Object.values(ROOMS)) {
    if (rx >= rm.x && rx <= rm.x + rm.w && ry >= rm.y && ry <= rm.y + rm.h) {
      selectTab(rm.id);
      return;
    }
  }
});

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('tab')) selectTab(urlParams.get('tab'));
</script>
